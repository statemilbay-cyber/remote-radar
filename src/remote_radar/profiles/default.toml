# Remote Radar · default profile
#
# Copy this file, edit it, and run:   radar run --profile my.local.toml
# Unknown keys are rejected, so a typo fails loudly instead of being ignored.

[candidate]
# Your UTC offset (6 for UTC+6, -5 for New York in winter).
utc_offset = 0
# How far, in hours, a role's working timezone may be from yours.
max_timezone_gap = 6
# The country you legally live and work from, spelled the way job boards do ("Georgia").
# Empty: any role limited to a short list of countries counts as closed to you.
country = ""
# Regions you can legally work from. "worldwide" matches roles open to everyone.
# Add "europe", "apac", "emea", ... only if you can actually be hired there.
regions = ["worldwide"]
# Minimum acceptable gross pay, USD per month.
min_monthly_usd = 1500
# Roles asking for more years of experience than this are pushed down the list.
max_required_years = 5
# Engagement types, most preferred first.
engagement_preference = ["contract", "part_time", "full_time"]
# Small boost for Web3 / crypto companies.
prefer_web3 = false

[filters]
# Titles containing any of these are not engineering roles and are never shown.
exclude_titles = [
  "account executive", "account manager", "sales", "business development", "marketing",
  "growth marketer", "seo", "recruiter", "recruiting", "talent", "customer success",
  "customer support", "support specialist", "support agent", "designer", "copywriter",
  "content writer", "writer", "editor", "nurse", "physician", "therapist", "teacher", "tutor",
  "accountant", "bookkeeper", "paralegal", "attorney", "lawyer", "counsel", "human resources",
  "people partner", "office manager", "executive assistant", "virtual assistant", "data entry",
  "product manager", "project manager", "program manager", "scrum master", "community manager",
  "social media", "lending", "loan officer", "mortgage", "underwriter", "insurance agent",
]
# Engineering specialisms outside the tracks below. Such titles pass only when they also
# name a track term ("DevOps / Python Engineer" passes, "Senior DevOps Engineer" does not).
off_track_titles = [
  "devops", "sre", "site reliability", "platform engineer", "infrastructure", "cloud engineer",
  "ios", "android", "mobile", "flutter", "react native", "embedded", "firmware", "hardware",
  "game", "unity", "unreal", "salesforce", "sap", "mainframe", "security engineer",
  "network engineer", "machine learning", "ml engineer", "data scientist", "research scientist",
  "computer vision", "golang", "go engineer", "rust", "java", "c++", ".net", "php", "ruby",
  "rails", "magento", "wordpress", "solidity", "expert",
]
# Talent networks and AI-training marketplaces: legitimate, but every placement goes through
# multi-stage vetting with live interviews. Flagged and pushed down, not hidden.
talent_networks = [
  "toptal", "lemon.io", "proxify", "micro1", "turing", "andela", "arc.dev", "mercor",
  "opentrain", "outlier", "mindrift", "dataannotation", "alignerr", "braintrust", "x-team",
  "gun.io", "g2i", "crossover", "silver.dev",
]

