[project]
name = "remote-radar"
version = "0.1.0"
description = "Collects remote engineering roles from public job feeds, scores them against a candidate profile and publishes a static dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["jobs", "remote", "scraping", "data-pipeline", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
]
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.27",
    "jinja2>=3.1.4",
]

[project.scripts]
radar = "remote_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "RET"]
# Typographic dashes and minus signs are real input data for the parsers.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
